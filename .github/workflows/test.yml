name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e ".[test]"
      - name: Run falsification tests
        run: python -m pytest -q
      - name: Compile example
        run: python -m bioir compile examples/toy_homeostasis.json
      - name: Simulate example
        run: python -m bioir simulate examples/toy_homeostasis.json

  semantic-model-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e ".[test]"
      - name: Run semantic-model contract tests
        run: python -m pytest -q tests/test_semantic_model.py
      - name: Check user-facing model before simulation
        run: python -m bioir check-model examples/toy_semantic_model.json
      - name: Export structural SBML
        run: python -m bioir export-sbml examples/toy_semantic_model.json --out /tmp/bioir-model.xml
      - name: Verify mathematical commitment is absent
        run: |
          python - <<'PY'
          from pathlib import Path
          xml = Path("/tmp/bioir-model.xml").read_text()
          assert "<kineticLaw" not in xml
          assert "mathematicalRepresentationCommitted=\"false\"" in xml
          print("semantic/SBML boundary verified")
          PY
