name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e ".[test]"
      - name: Run falsification tests
        run: python -m pytest -q
      - name: Compile example
        run: python -m bioir compile examples/toy_homeostasis.json
      - name: Simulate example
        run: python -m bioir simulate examples/toy_homeostasis.json
