name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e ".[test]"
      - name: Run falsification tests
        run: python -m pytest -q
      - name: Compile example
        run: python -m bioir compile examples/toy_homeostasis.json
      - name: Simulate example
        run: python -m bioir simulate examples/toy_homeostasis.json

  semantic-model-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package, tests and libSBML
        run: python -m pip install -e ".[test,sbml]"
      - name: Run semantic and completion contract tests
        run: python -m pytest -q tests/test_semantic_model.py tests/test_completion.py tests/test_render.py
      - name: Check complete semantic model
        run: python -m bioir check-model examples/toy_semantic_model.json
      - name: Check under-specified semantic model
        run: python -m bioir check-model examples/underspecified_conversion.json
      - name: Emit unresolved mathematical commitments
        run: python -m bioir plan-completion examples/underspecified_conversion.json
      - name: Render human/AI-readable model
        run: python -m bioir show-model examples/underspecified_conversion.json
      - name: Render human/AI-readable completion receipt
        run: python -m bioir plan-completion examples/underspecified_conversion.json --format text
      - name: Export structural SBML
        run: python -m bioir export-sbml examples/underspecified_conversion.json --out /tmp/bioir-model.xml
      - name: Verify no mathematics was silently invented
        run: |
          python - <<'PY'
          from pathlib import Path
          xml = Path("/tmp/bioir-model.xml").read_text()
          assert "<kineticLaw" not in xml
          assert "mathematicalRepresentationCommitted=\"false\"" in xml
          assert 'id="k1"' in xml
          assert 'id="k1" value=' not in xml
          print("no hidden kinetics or parameter value introduced")
          PY
      - name: Validate generated document with libSBML
        run: |
          python - <<'PY'
          import libsbml

          document = libsbml.readSBML("/tmp/bioir-model.xml")
          document.checkConsistency()

          serious = []
          for index in range(document.getNumErrors()):
              error = document.getError(index)
              if error.getSeverity() >= libsbml.LIBSBML_SEV_ERROR:
                  serious.append(
                      f"{error.getErrorId()}: {error.getMessage().strip()}"
                  )

          if serious:
              raise SystemExit("\n".join(serious))

          model = document.getModel()
          assert model is not None
          assert model.getNumCompartments() == 1
          assert model.getNumSpecies() == 2
          assert model.getNumParameters() == 1
          assert model.getNumReactions() == 1
          assert model.getParameter("k1").isSetValue() is False
          assert model.getReaction(0).isSetKineticLaw() is False
          print("libSBML accepted under-specified structural model")
          PY
