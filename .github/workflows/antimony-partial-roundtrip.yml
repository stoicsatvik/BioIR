name: BioIR Antimony 3 partial-model round-trip

on:
  push:
    branches:
      - research/e510-antimony-partial-roundtrip-20261110
    paths:
      - .github/workflows/antimony-partial-roundtrip.yml
      - bioir/sbml_backend.py
      - examples/underspecified_conversion.json
      - pyproject.toml
      - research/e510_antimony_partial_roundtrip.py
      - tests/test_e510_antimony_partial_roundtrip.py
  pull_request:
    branches:
      - research/e509-sbml-observation-design-20261102
    paths:
      - .github/workflows/antimony-partial-roundtrip.yml
      - bioir/sbml_backend.py
      - examples/underspecified_conversion.json
      - pyproject.toml
      - research/e510_antimony_partial_roundtrip.py
      - tests/test_e510_antimony_partial_roundtrip.py

permissions:
  contents: read

jobs:
  antimony-partial-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned BioIR, libSBML and Antimony dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,sbml,antimony]"
      - name: Run the partial-model interoperability probe
        run: |
          python research/e510_antimony_partial_roundtrip.py --out "$RUNNER_TEMP/e510-antimony"
      - name: Run deterministic Antimony probe tests
        run: pytest -q tests/test_e510_antimony_partial_roundtrip.py
      - name: Preserve interoperability receipt and round-trip artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e510-antimony-partial-model
          path: ${{ runner.temp }}/e510-antimony/
          if-no-files-found: warn
          retention-days: 30
