[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioir"
version = "0.1.0"
description = "Simulation-only intermediate representation for programmable biology research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "BioIR contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
bioir = "bioir.cli:main"

[tool.setuptools.packages.find]
include = ["bioir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
